#meeting
server {
    listen 80;
    server_name www.liyasoftware.com;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    if ($http_user_agent ~ \$\{jndi.*\} ) {
           return 404;
    }

    location  / {
        rewrite ^/(.*)$ https://www.liyasoftware.com/$1 permanent;
    }
}


server {
       listen 443 ssl;
       ssl_certificate /etc/nginx/ssl/www.liyasoftware.com.pem;
       ssl_certificate_key /etc/nginx/ssl/www.liyasoftware.com.key;
       ssl_protocols  TLSv1 TLSv1.1 TLSv1.2;
       #ssl_ciphers ECDHE-RSA-AES256-SHA384:AES256-SHA256:RC4:HIGH:!MD5:!aNULL:!eNULL:!NULL:!DH:!EDH:!AESGCM;
       ssl_prefer_server_ciphers on;
       server_name www.liyasoftware.com;
       access_log  /var/log/nginx/www.liyasoftware.com.log main;
       root /usr/server/wwwroot; 
       #开启gzip压缩
       gzip on;
       gzip_min_length 1k;
       gzip_comp_level 7;
       gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json ;
       gzip_vary on;
       gzip_buffers 2 4k;

      location /download/ {
    
    	# 防止路径遍历攻击
   	 alias /usr/server/download/;
    
   	 # 记录访问日志
    	access_log /var/log/nginx/download_access.log;
    
    	# 缓存静态文件设置
    	expires 1d;
    	add_header Cache-Control "public, immutable";
    
    	# 下载优化
    	sendfile on;
    	tcp_nopush on;
    	tcp_nodelay off;
   
       # 统一强制下载，不写 filename，浏览器自动用 URL 末段
    	add_header Content-Disposition 'attachment; filename="$filename"';	
   	# 强制下载（不显示在浏览器中）
    	# 对特定 MIME 类型强制下载
    	location ~* \.(apk|ipa|zip|rar|7z|exe|msi|deb|rpm)$ {
           default_type application/octet-stream;
   	 }	
    
    	# 对于 .apk 文件，设置正确的 MIME 类型
    	location ~* \.apk$ {
            default_type application/vnd.android.package-archive;
    	}
    
    	# 禁止直接访问隐藏文件
    	location ~ /\. {
           deny all;
    	}
     } 

     location /smartplan/ {
	proxy_read_timeout 1800s;
	proxy_redirect off;
	proxy_set_header Host $host;
	proxy_set_header   X-Real-IP $remote_addr;
	proxy_set_header   X-Forwarded-For $remote_addr;
	proxy_set_header   X-Forwarded-Proto $scheme;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_pass http://smart-plan-server;
        break;
     }

     location /html/ {
    	root /usr/server/h5;
    
   	# 防止热链（可选）
    	#valid_referers none blocked server_names;
	#if ($invalid_referer) {
       # 	return 403;
    #	}
    
    	# 添加安全头
    	add_header X-Content-Type-Options "nosniff";
    }		

    location ~ /(server.sh|.gitlab-ci.yml) {
        return 404;
    }
 
}

