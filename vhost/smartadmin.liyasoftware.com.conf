#meeting
server {
    listen 80;
    server_name smartadmin.liyasoftware.com.conf;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    if ($http_user_agent ~ \$\{jndi.*\} ) {
           return 404;
    }

    location  / {
        rewrite ^/(.*)$ https://smartadmin.liyasoftware.com.conf/$1 permanent;
    }
}


server {
       listen 443 ssl;
       ssl_certificate /etc/nginx/ssl/smartadmin.liyasoftware.com.pem;
       ssl_certificate_key /etc/nginx/ssl/smartadmin.liyasoftware.com.key;
       ssl_protocols  TLSv1 TLSv1.1 TLSv1.2;
       #ssl_ciphers ECDHE-RSA-AES256-SHA384:AES256-SHA256:RC4:HIGH:!MD5:!aNULL:!eNULL:!NULL:!DH:!EDH:!AESGCM;
       ssl_prefer_server_ciphers on;
       server_name smartadmin.liyasoftware.com;
       access_log  /var/log/nginx/smartadmin.liyasoftware.com.log main; 
       #开启gzip压缩
       gzip on;
       gzip_min_length 1k;
       gzip_comp_level 7;
       gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json ;
       gzip_vary on;
       gzip_buffers 2 4k;
 

     location / {
	proxy_read_timeout 1800s;
	proxy_redirect off;
	proxy_set_header Host $host;
	proxy_set_header   X-Real-IP $remote_addr;
	proxy_set_header   X-Forwarded-For $remote_addr;
	proxy_pass http://172.21.166.154:3000;
        break;
     }


    location ~ /(server.sh|.gitlab-ci.yml) {
        return 404;
    }
 
}

