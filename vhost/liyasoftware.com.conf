server {
    listen 80;
    server_name liyasoftware.com;

    location / {
        # 将 example.com 重写为 www.example.com，但不改变 URL 在浏览器中显示的 URL
        rewrite ^(.*) http://www.liyasoftware.com$1 permanent;
    }
}

server {
    listen 443 ssl;
     ssl_certificate /etc/nginx/ssl/liyasoftware.com.pem;
       ssl_certificate_key /etc/nginx/ssl/liyasoftware.com.key;
       ssl_protocols  TLSv1 TLSv1.1 TLSv1.2;
       #ssl_ciphers ECDHE-RSA-AES256-SHA384:AES256-SHA256:RC4:HIGH:!MD5:!aNULL:!eNULL:!NULL:!DH:!EDH:!AESGCM;
       ssl_prefer_server_ciphers on;
       server_name liyasoftware.com;
       access_log  /var/log/nginx/liyasoftware.com.log main;
       root /usr/server/wwwroot;
       #开启gzip压缩
       gzip on;
       gzip_min_length 1k;
       gzip_comp_level 7;
       gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/json ;
       gzip_vary on;
       gzip_buffers 2 4k;
      return 301 https://www.liyasoftware.com$request_uri;
}
